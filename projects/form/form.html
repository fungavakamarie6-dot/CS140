<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tonga Tour Sign-up</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>

  <header>
    <h1>Visit Tonga</h1>
    <p>Sign up for a guided tour</p>
  </header>

  <main>
    <form action="#" method="post">

      <fieldset>
        <legend>About you</legend>

        <div class="row">
          <label class="main" for="fullname">Full name</label>
          <input type="text" id="fullname" name="fullname" required>
        </div>

        <div class="row">
          <label class="main" for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="row">
          <label class="main" for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
        </div>

        <div class="row">
          <label class="main" for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Your tour</legend>

        <div class="row">
          <label class="main" for="site">Tour site</label>
          <select id="site" name="site" required>
            <option value="">Pick one</option>
            <option value="captain-cook">Captain Cook Landing Site</option>
            <option value="anahulu">Anahulu Cave</option>
            <option value="kings-house">Kings House</option>
          </select>
        </div>

        <div class="row">
          <label class="main" for="tourdate">Date</label>
          <input type="date" id="tourdate" name="tourdate" required>
        </div>

        <div class="row">
          <label class="main" for="groupsize">Group size</label>
          <input type="number" id="groupsize" name="groupsize" min="1" max="20" value="1">
        </div>

        <div class="row">
          <span class="grouptitle">Pace</span>
          <div class="choices">
            <input type="radio" id="relaxed" name="pace" value="relaxed" checked>
            <label for="relaxed">Relaxed</label>

            <input type="radio" id="standard" name="pace" value="standard">
            <label for="standard">Standard</label>

            <input type="radio" id="adventure" name="pace" value="adventure">
            <label for="adventure">Adventure</label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Extras</legend>

        <div class="row">
          <span class="grouptitle">Interests</span>
          <div class="choices">
            <input type="checkbox" id="photos" name="interests" value="photography">
            <label for="photos">Photography</label>

            <input type="checkbox" id="history" name="interests" value="history">
            <label for="history">History</label>

            <input type="checkbox" id="food" name="interests" value="food">
            <label for="food">Local food</label>
          </div>
        </div>

        <div class="row">
          <label class="main" for="requests">Requests</label>
          <textarea id="requests" name="requests" rows="4" placeholder="Anything we should know?"></textarea>
        </div>

        <div class="row terms">
          <input type="checkbox" id="terms" name="terms" value="agree" required>
          <label for="terms">I agree to the tour terms</label>
        </div>
      </fieldset>

      <button type="submit">Sign up</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Marie Fungavaka</p>
  </footer>

</body>
</html>
