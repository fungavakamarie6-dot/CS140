<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Processing</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header>
        <h1>Form Processing</h1>
    </header>
    <main>
        <div id="message"></div>
        <form action="processing.html" method="post" id="myForm">
            First Name: <input type="text" name="first" id="firstName" placeholder="First Name"><br>
            Last Name: <input type="text" name="last" id="lastName" placeholder="Lat Name"><br>
            Password: <input type="password" name="pass" id="password"><br>
            <input type="checkbox" name="remember" checked id="remember"> Remember Me<br>
            Age: <input type="number" name="age" id="age"><br>
            Birth Date: <input type="date" name="birthdate" id="birthdate"><br>
            Class:
            <input type="radio" value="freshman">Freshman<br>
            <input type="radio" value="sophomore">Sophomore<br>
            <input type="radio" value="junior">Junior<br>
            <input type="radio" value="senior">Senior<br>
            State: <select name="state" id="state">
                <option value="blank" disabled selected>Make Selection</option>
                <option value="hi">Hawaii</option>
                <option value="ca">California</option>
                <option value="co">Colorado</option>
                <option value="ut">Utah</option>
            </select><br>
            <input type="submit">
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Marie Fungavaka</p>
    </footer>
    <script src="formprocessing.js"></script>
</body>
</html>
